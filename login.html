<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign In | Spice & Ember</title>
<meta name="description" content="Sign in to your Spice & Ember account.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23C9A84C' d='M12 2C9 7 6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-3-7-6-12zm0 18a4 4 0 0 1-4-4c0-2.5 1.5-4.3 4-7.5 2.5 3.2 4 5 4 7.5a4 4 0 0 1-4 4z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mobile-redesign app-page">

<header id="top-navbar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
  <input class="search-bar" type="text" placeholder="Search dishes..." aria-label="Search dishes">
  <a href="profile.html" class="navbar-profile-link" aria-label="Profile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
  </a>
</header>

<main class="page-main">

  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C9 7 6 9.5 6 14a6 6 0 0 0 12 0c0-4.5-3-7-6-12zm0 18a4 4 0 0 1-4-4c0-2.5 1.5-4.3 4-7.5 2.5 3.2 4 5 4 7.5a4 4 0 0 1-4 4z"/></svg>
    </div>
    <h1>Welcome Back</h1>
    <p class="login-sub">Sign in to continue to Spice &amp; Ember</p>

    <form id="pageLoginForm">
      <div class="form-field">
        <label for="pageLoginEmail">Email</label>
        <input type="email" id="pageLoginEmail" required placeholder="you@email.com" autocomplete="email">
      </div>
      <div class="form-field">
        <label for="pageLoginPassword">Password</label>
        <input type="password" id="pageLoginPassword" required minlength="6" placeholder="Your password" autocomplete="current-password">
      </div>
      <p class="login-error" id="pageLoginError"></p>
      <button type="submit" class="btn-gold" id="pageLoginSubmit">Sign In</button>
    </form>

    <p class="login-alt">Don't have an account? <a href="javascript:void(0)" id="pageSignupLink">Sign Up</a></p>
  </div>

</main>

<nav id="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </a>
  <a href="index.html#full-menu" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span>Menu</span>
  </a>
  <a href="order.html" class="nav-item center-btn" aria-label="Cart">
    <span class="center-plus">+</span>
  </a>
  <a href="book-table.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Reserve</span>
  </a>
  <a href="about.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>About</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/razorpay.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
(function() {
  var form = document.getElementById('pageLoginForm');
  var errEl = document.getElementById('pageLoginError');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errEl.style.display = 'none';
    var btn = document.getElementById('pageLoginSubmit');
    btn.disabled = true;
    btn.textContent = 'Signing In...';
    try {
      await Auth.signIn(
        document.getElementById('pageLoginEmail').value.trim(),
        document.getElementById('pageLoginPassword').value
      );
      window.location.href = 'profile.html';
    } catch (err) {
      errEl.textContent = err.message || 'Invalid email or password';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
  document.getElementById('pageSignupLink').addEventListener('click', function() {
    Auth.openModal('signup');
  });
  // Already signed in? Go to profile
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      if (Auth && Auth.isLoggedIn) window.location.href = 'profile.html';
    }, 400);
  });
})();
</script>
</body>
</html>
