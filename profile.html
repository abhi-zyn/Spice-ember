<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mobile-redesign app-page">

<header id="top-navbar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
  <input class="search-bar" type="text" placeholder="Search dishes..." aria-label="Search dishes">
  <a href="profile.html" class="navbar-profile-link" aria-label="Profile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
  </a>
</header>

<main class="page-main">

  <div class="profile-head">
    <div class="profile-avatar" id="profileAvatar">G</div>
    <h1 id="profileName">Guest</h1>
    <p id="profileEmail">Sign in to sync your orders &amp; reservations</p>
  </div>

  <div class="settings-list">
    <a href="order.html" class="settings-row">
      <span class="row-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </span>
      <span class="row-label">Order History</span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <a href="book-table.html" class="settings-row">
      <span class="row-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </span>
      <span class="row-label">Reservations</span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
    <button type="button" class="settings-row" id="notifRow">
      <span class="row-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </span>
      <span class="row-label">Notifications</span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button type="button" class="settings-row danger" id="logoutRow">
      <span class="row-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </span>
      <span class="row-label" id="logoutLabel">Logout</span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

</main>

<nav id="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </a>
  <a href="index.html#full-menu" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span>Menu</span>
  </a>
  <a href="order.html" class="nav-item center-btn" aria-label="Cart">
    <span class="center-plus">+</span>
  </a>
  <a href="book-table.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Reserve</span>
  </a>
  <a href="about.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span>About</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/razorpay.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
(function() {
  function refreshProfile() {
    var nameEl = document.getElementById('profileName');
    var emailEl = document.getElementById('profileEmail');
    var avatarEl = document.getElementById('profileAvatar');
    var logoutLabel = document.getElementById('logoutLabel');
    if (Auth && Auth.isLoggedIn) {
      nameEl.textContent = Auth.userName;
      emailEl.textContent = Auth.userEmail || '';
      avatarEl.textContent = (Auth.userName || 'U').charAt(0).toUpperCase();
      logoutLabel.textContent = 'Logout';
    } else {
      nameEl.textContent = 'Guest';
      emailEl.textContent = 'Sign in to sync your orders & reservations';
      avatarEl.textContent = 'G';
      logoutLabel.textContent = 'Sign In';
    }
  }
  document.addEventListener('DOMContentLoaded', function() { setTimeout(refreshProfile, 300); });
  document.getElementById('logoutRow').addEventListener('click', function() {
    if (Auth && Auth.isLoggedIn) {
      Auth.signOut();
      setTimeout(refreshProfile, 300);
    } else {
      window.location.href = 'login.html';
    }
  });
  document.getElementById('notifRow').addEventListener('click', function() {
    Utils.showToast('Notification preferences coming soon', 'info');
  });
})();
</script>
</body>
</html>
