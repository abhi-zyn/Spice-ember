<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Spice & Ember</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <style>
    .admin-login-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .admin-login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .admin-login-logo {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 4px;
    }
    .admin-login-logo span { color: var(--gold); }
    .admin-login-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .admin-login-card .form-group {
      text-align: left;
    }
    .admin-login-error {
      background: rgba(239,68,68,0.1);
      color: var(--error);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <section class="admin-login-section">
    <div class="admin-login-card">
      <div class="admin-login-logo">Spice <span>&amp;</span> Ember</div>
      <p class="admin-login-sub">Admin Portal</p>
      <div class="admin-login-error" id="loginError">Invalid credentials. Please try again.</div>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">Sign In</button>
      </form>
      <p style="margin-top:20px;font-size:12px;color:var(--text-muted)">Default: admin / admin123</p>
    </div>
  </section>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (username === 'admin' && password === 'admin123') {
        localStorage.setItem('spice-ember-admin', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
