<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — Spice & Ember Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
  <div class="admin-body">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <h2>Spice <span>&amp;</span> Ember</h2>
        <p>Admin Panel</p>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="bookings.html" class="active"><span class="nav-icon">📅</span> Bookings</a>
        <a href="orders.html"><span class="nav-icon">🛒</span> Orders</a>
        <a href="menu-manage.html"><span class="nav-icon">🍽️</span> Menu</a>
        <a href="index.html" style="margin-top:auto;border-top:1px solid var(--border);padding-top:16px"><span class="nav-icon">🚪</span> Logout</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div class="admin-header-left">
          <h1>Bookings</h1>
          <p>Manage table reservations</p>
        </div>
        <div class="admin-header-right">
          <div class="admin-user">
            <div class="admin-avatar">A</div>
            <div class="admin-user-info">
              <div class="admin-user-name">Admin</div>
              <div class="admin-user-role">Manager</div>
            </div>
          </div>
        </div>
      </div>

      <div class="admin-table-wrapper">
        <div class="admin-table-header">
          <h3>All Reservations</h3>
          <div style="display:flex;gap:8px">
            <select id="bookingFilter" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:13px">
              <option value="all">All Status</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Guest</th>
              <th>Date</th>
              <th>Time</th>
              <th>Guests</th>
              <th>Occasion</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookingsTable"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
